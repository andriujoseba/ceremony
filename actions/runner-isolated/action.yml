name: Runner isolated
description: >-
  Assert that no workflow file which executes PR-authored code names a
  self-hosted runner the consumer has not vouched for (#58, axis corrected
  in #395). A file executes PR-authored code when it is
  `pull_request`-triggered (unconditionally — the trigger implies the
  context) or when it is `pull_request_target`-triggered AND checks out a
  PR ref; that second row, base-branch privileges running PR-authored
  code, is the most dangerous shape in the trigger surface and the one the
  first version could not see. A `pull_request_target` file that checks
  out nothing executes no PR code and passes with no allowlist entry.
  Whether a runner tier is isolated cannot be read off a workflow file, so
  it stays an assertion: `pr-code-runner-labels` names the labels
  PR-authored code may execute on. Empty by default, so a caller passing
  nothing vouches for nothing. Self-hosted labels are read from `runs-on:`
  (same-line and block-sequence) and from `with:` input values, the shape
  a reusable-workflow caller uses, quoted, flow or block-scalar alike, and
  a flow collection is read to its own closing bracket rather than to the
  end of its first line, so one written across several lines is scanned
  like any other; a quoted scalar is opaque, so a bracket or comma inside
  quotes is that value's text and not its end, wherever its lines fall. A
  key's value is read wherever it begins: a flow collection, or a plain
  or quoted scalar, on the line after the key is that key's value as much
  as a `- …` list is — a block mapping under `runs-on:` being the one
  shape not read there — and an alias is its anchor's value, so
  `runner: *runner-input` is judged on the labels the anchor names,
  wherever the line writes the anchor; a `*name` inside a quoted scalar is
  that scalar's own text. A
  comment is the other way round: never part of a value, ending with its
  own line and closing nothing, so a `}` inside one leaves the collection
  open — and it begins wherever YAML lets one begin, after a space, after
  a `{`, `[`, `,`, `]` or `}` in flow context, or after a quoted scalar's
  closing quote, a `#` being part of a value only where it continues a
  plain scalar (`ci#runner`, `a:#b`, and `a,#b` in block context where a
  `,` may sit in one) or sits inside a quoted one. The exception is a
  block scalar, whose lines are literal text the callee receives, `#` and
  all. A collection's values are its own at every
  nesting depth: a key beside a runner spec never vouches for it, however
  many brackets separate them.
  The rule is file-level, deliberately: a file that executes PR code and
  names an unvouched self-hosted label anywhere fails, even across jobs —
  the fix is to split the workflow or vouch for the tier. Known gaps, so
  silence is never read as coverage: `workflow_call` reachability is not
  followed across files (only the label passed through `with:` is seen), a
  PR head fetched by hand inside a `run:` block is not a `ref:` key and is
  not detected, indirection is not resolved (runner groups, matrix or
  expression values for `runs-on`), an alias is resolved only from an
  anchor the same file defines above it and an anchor is recorded from
  the line it heads, `runs-on:` in its block-mapping form selects no
  fragment, and a `with:` input's value is read as
  labels whatever the key is called, so prose a PR-code file passes to a
  reusable workflow is reported as a label set (ruled, not pending:
  ceremony discussion #403). A missing workflows
  directory is a
  pass. The caller must have checked out its own repository first: the
  guard reads the consumer's tree at the workspace.
inputs:
  workflows-dir:
    description: >-
      Directory scanned for `*.yml`/`*.yaml` workflow files. A missing
      directory passes — a guard that fails on absence is a guard nobody
      adopts.
    required: false
    default: .github/workflows
  pr-code-runner-labels:
    description: >-
      Comma-separated runner labels on which PR-authored code MAY execute —
      the consumer's assertion, which no workflow file can prove. Empty by
      default: nothing is vouched for, so every file that executes
      PR-authored code keeps the verdict it had before the input existed.
      That is the input's whole compatibility claim and not a wider one:
      the axis correction above moves one verdict on its own, a
      `pull_request_target` file with a self-hosted runner and no PR-ref
      checkout, which failed before #395 and passes now however it is
      routed. A `runs-on:` label set is a conjunction, so naming one
      label of a set vouches for the whole set — one set, one value:
      two runners named on one line are two sets, and vouching for one
      leaves the other guarded. A value is one value however its lines
      fall, so a collection spread over several is still one set. Name the
      untrusted tier and never the trusted one: the runner you vouch for
      must publish no artifact a trusted job consumes, hold no credential
      the job should not have, and reach nothing the PR author should not
      reach — `docs/CONSUMERS.md` states the bar with incubator's split as
      the worked example. Naming `self-hosted` itself vouches for every
      self-hosted tier you have and is almost never what you mean (#395).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: runner isolated
      shell: bash
      env:
        WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
        PR_CODE_RUNNER_LABELS: ${{ inputs.pr-code-runner-labels }}
      run: bash "$GITHUB_ACTION_PATH/runner-isolated.sh"
