name: Reconcile labels
description: Converge PR state and optionally bootstrap the label taxonomy
inputs:
  bootstrap:
    description: Whether to bootstrap labels before reconciling (yes or no)
    required: true
    default: "no"
  auto_merge:
    description: Auto-merge verdict mode (off, merge, squash, or rebase)
    required: false
    default: "off"
  post_merge_workflow:
    description: >-
      A workflow in this repository to dispatch after an auto-merge, restoring
      the push-triggered run a GITHUB_TOKEN merge does not raise. Empty (the
      default) dispatches nothing. The named workflow must declare
      workflow_dispatch:, and the caller needs actions: write.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: validate bootstrap input
      shell: bash
      env:
        BOOTSTRAP: ${{ inputs.bootstrap }}
      run: |
        case "$BOOTSTRAP" in
          yes | no) ;;
          *) echo "bootstrap must be 'yes' or 'no'" >&2; exit 2 ;;
        esac
    - name: validate auto_merge input
      shell: bash
      env:
        AUTO_MERGE: ${{ inputs.auto_merge }}
      run: |
        case "$AUTO_MERGE" in
          off | merge | squash | rebase) ;;
          *) echo "auto_merge must be one of: off, merge, squash, rebase" >&2; exit 2 ;;
        esac
    - name: reconcile labels
      shell: bash
      env:
        BOOTSTRAP: ${{ inputs.bootstrap }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
        # No validation step, deliberately (#461 D4): whether the workflow
        # exists, declares workflow_dispatch: and is dispatchable by this token
        # are three questions `gh workflow run` already answers by failing, and
        # the reconciler prints the answer. Unlike auto_merge, whose accepted
        # set is closed and knowable here.
        POST_MERGE_WORKFLOW: ${{ inputs.post_merge_workflow }}
        LABELS_CONF: ${{ github.workspace }}/.github/labels.conf
      run: |
        if [ "$BOOTSTRAP" = yes ]; then
          export GITHUB_EVENT_NAME=workflow_dispatch
        fi
        bash "$GITHUB_ACTION_PATH/labels-reconcile.sh"
