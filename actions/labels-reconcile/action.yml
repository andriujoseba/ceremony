name: Reconcile labels
description: Converge PR state and optionally bootstrap the label taxonomy
inputs:
  bootstrap:
    description: Whether to bootstrap labels before reconciling (yes or no)
    required: true
    default: "no"
  bootstrap_only:
    description: >-
      Whether to stop after the taxonomy bootstrap instead of sweeping the
      open pull requests (yes or no). Off by default, which is every caller
      but the sweep's own bootstrap job. On, the reconciler upserts the
      taxonomy, retires the defaults and returns without reading the PR
      list — which is what lets that job sit outside the sweep's shared
      concurrency group without ever racing a sweep beside it (#506).
    required: false
    default: "no"
  auto_merge:
    description: Auto-merge verdict mode (off, merge, squash, or rebase)
    required: false
    default: "off"
  auto_merge_release:
    description: Release auto-merge mode (off, merge, squash, or rebase)
    required: false
    default: "off"
  post_merge_workflow:
    description: >-
      A workflow in this repository to dispatch after an auto-merge, restoring
      the push-triggered run a GITHUB_TOKEN merge does not raise. Empty (the
      default) dispatches nothing. The named workflow must declare
      workflow_dispatch:, and the caller needs actions: write.
    required: false
    default: ""
  release_workflow:
    description: >-
      The release caller to dispatch after an auto-merged release. It must
      accept workflow_dispatch merged-sha; the labels caller needs actions:
      write. Empty prevents release auto-merges.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: validate bootstrap input
      shell: bash
      env:
        BOOTSTRAP: ${{ inputs.bootstrap }}
        BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
      run: |
        case "$BOOTSTRAP" in
          yes | no) ;;
          *) echo "bootstrap must be 'yes' or 'no'" >&2; exit 2 ;;
        esac
        case "$BOOTSTRAP_ONLY" in
          yes | no) ;;
          *) echo "bootstrap_only must be 'yes' or 'no'" >&2; exit 2 ;;
        esac
    - name: validate auto_merge input
      shell: bash
      env:
        AUTO_MERGE: ${{ inputs.auto_merge }}
      run: |
        case "$AUTO_MERGE" in
          off | merge | squash | rebase) ;;
          *) echo "auto_merge must be one of: off, merge, squash, rebase" >&2; exit 2 ;;
        esac
    - name: validate auto_merge_release input
      shell: bash
      env:
        AUTO_MERGE_RELEASE: ${{ inputs.auto_merge_release }}
      run: |
        case "$AUTO_MERGE_RELEASE" in
          off | merge | squash | rebase) ;;
          *) echo "auto_merge_release must be one of: off, merge, squash, rebase" >&2; exit 2 ;;
        esac
    - name: reconcile labels
      shell: bash
      env:
        BOOTSTRAP: ${{ inputs.bootstrap }}
        BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
        AUTO_MERGE_RELEASE: ${{ inputs.auto_merge_release }}
        # No validation step, deliberately (#461 D4): whether the workflow
        # exists, declares workflow_dispatch: and is dispatchable by this token
        # are three questions `gh workflow run` already answers by failing, and
        # the reconciler prints the answer. Unlike auto_merge, whose accepted
        # set is closed and knowable here.
        POST_MERGE_WORKFLOW: ${{ inputs.post_merge_workflow }}
        RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
        LABELS_CONF: ${{ github.workspace }}/.github/labels.conf
      run: bash "$GITHUB_ACTION_PATH/labels-reconcile.sh"
